<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Play Tester Tracker | Marwan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --surface-subtle: #F0EDE4;
      --border: #E6E1D6;
      --text-main: #2C2825;
      --text-muted: #7A7265;
      --accent: #B05D3B;          /* Terracotta دافئ */
      --accent-hover: #964B2C;
      --olive: #5B6B54;           /* أخضر زيتوني للمهام المكتملة */
      --tag-bg: #EAE5D9;
      --shadow: 0 4px 20px rgba(44, 40, 37, 0.05);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 32px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-marwan {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.8rem;
      background: var(--tag-bg);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Card Form */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .form-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
    }

    @media (max-width: 600px) {
      form {
        grid-template-columns: 1fr;
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      background: #FFF;
    }

    button.btn-primary {
      align-self: flex-end;
      padding: 11px 22px;
      background: var(--accent);
      color: #FFF;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
      height: 44px;
    }

    button.btn-primary:hover {
      background: var(--accent-hover);
    }

    /* Tracked Apps List */
    .apps-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 0.95rem;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
    }

    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow);
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-name {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #A39B8F;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px;
      transition: color 0.2s;
    }

    .btn-delete:hover {
      color: #A33;
    }

    .date-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .timeline-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .checkpoints {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    @media (max-width: 500px) {
      .checkpoints {
        grid-template-columns: 1fr;
      }
    }

    .checkpoint-item {
      background: var(--surface-subtle);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .checkpoint-day {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--accent);
    }

    .checkpoint-date {
      font-size: 0.8rem;
      color: var(--text-main);
    }

    .checkpoint-status {
      font-size: 0.75rem;
      margin-top: 2px;
      font-weight: 500;
    }

    .status-upcoming {
      color: var(--text-muted);
    }

    .status-today {
      color: #C07000;
      font-weight: 700;
    }

    .status-done {
      color: var(--olive);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-title">
        <span>مساعد اختبار التطبيقات</span>
        <span class="badge-marwan">Marwan's Hub</span>
      </div>
    </header>

    <!-- إضافة تطبيق جديد -->
    <div class="card">
      <div class="form-title">إضافة تطبيق جديد للاختبار (14 يوماً)</div>
      <form id="add-app-form">
        <div class="input-group">
          <label for="app-name">اسم التطبيق</label>
          <input type="text" id="app-name" placeholder="مثال: Quick Tasks App" required>
        </div>

        <div class="input-group">
          <label for="start-date">تاريخ البداية (اليوم 1)</label>
          <input type="date" id="start-date" required>
        </div>

        <button type="submit" class="btn-primary">إضافة للمتابعة</button>
      </form>
    </div>

    <!-- قائمة التطبيقات المسجلة -->
    <div class="apps-list" id="apps-list">
      <!-- يتم توليد البطاقات عبر JavaScript -->
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
